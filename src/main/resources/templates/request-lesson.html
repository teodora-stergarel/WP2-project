<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Request Lesson</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>

        body{
            margin:0;
            background:#F3EFDE;
            font-family: Georgia, serif;
        }

        .request-wrapper{
            width:1100px;
            margin:60px auto;
            border:8px solid #563A9C;
            border-radius:45px;
            background:#F3EFDE;
            padding:55px;
            position:relative;

            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:60px;
        }

        .left-side{
            width:420px;
        }

        .right-side{
            flex:1;
            display:flex;
            flex-direction:column;
            gap:25px;
            padding-top:20px;
        }

        .calendar-title{
            color:#563A9C;
            font-size:28px;
            font-weight:bold;
            margin-bottom:18px;
        }

        .calendar-input{
            width:100%;
            padding:18px;
            border:none;
            border-radius:20px;
            background:#C9BEFF;
            font-size:22px;
            color:#563A9C;
        }

        .time-title{
            color:#563A9C;
            font-size:28px;
            font-weight:bold;
            margin-top:35px;
            margin-bottom:18px;
        }

        .time-select{
            width:100%;
            padding:18px;
            border:none;
            border-radius:20px;
            background:#A8A8A8;
            color:white;
            font-size:22px;
        }

        .offer-author{
            background:#563A9C;
            color:white;
            border-radius:20px;
            padding:18px 30px;
            font-size:26px;
            font-weight:bold;
            width:fit-content;
        }

        .offer-info-box{
            background:#A8A8A8;
            color:#F3EFDE;
            border-radius:20px;
            padding:20px;
            font-size:28px;
            font-weight:bold;
            width:320px;
        }

        .offer-description{
            font-size:24px;
            color:black;
            line-height:1.4;
            max-width:500px;
        }

        .buttons-row{
            margin-top:30px;
            display:flex;
            gap:25px;
        }

        .back-btn{
            background:#A8A8A8;
            color:#F3EFDE;
            text-decoration:none;
            padding:20px 40px;
            border-radius:20px;
            font-size:28px;
            font-weight:bold;
            border:none;
            cursor:pointer;
        }

        .request-btn{
            background:#C9BEFF;
            color:#563A9C;
            text-decoration:none;
            padding:20px 40px;
            border-radius:20px;
            font-size:28px;
            font-weight:bold;
            border:none;
            cursor:pointer;
        }

        .close-btn{
            position:absolute;
            top:25px;
            right:25px;

            width:70px;
            height:70px;

            border:5px solid #563A9C;
            border-radius:20px;

            display:flex;
            justify-content:center;
            align-items:center;

            text-decoration:none;

            color:#563A9C;
            font-size:60px;
            font-weight:bold;

            background:#F3EFDE;
        }

    </style>
</head>
<body>

<div class="request-wrapper">

    <a th:href="@{/offers}" class="close-btn">
        ×
    </a>

    <div class="left-side">

        <div class="calendar-title">
            Select lesson date:
        </div>

        <input type="date" class="calendar-input">

        <div class="time-title">
            Starting time:
        </div>

        <select class="time-select">
            <option>08:00</option>
            <option>09:00</option>
            <option>10:00</option>
            <option>11:00</option>
            <option>12:00</option>
            <option>13:00</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16:00</option>
            <option>17:00</option>
            <option>18:00</option>
            <option>19:00</option>
            <option>20:00</option>
        </select>

    </div>

    <div class="right-side">

        <div class="offer-author">
            @<span th:text="${offer.owner.name}"></span>
        </div>

        <div class="offer-info-box">
            Subject:
            <span th:text="${offer.title}"></span>
        </div>

        <div class="offer-info-box">
            Credits:
            <span th:text="${offer.priceCredits}"></span>
        </div>

        <div class="offer-description"
             th:text="${offer.description}">
        </div>

        <div class="buttons-row">

            <a th:href="@{/offers}" class="back-btn">
                Go back
            </a>

            <form th:action="@{/offers/request/{id}(id=${offer.id})}"
                      method="post">

                <button type="submit" class="request-btn">
                    Request lesson
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
