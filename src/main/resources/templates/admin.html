<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .topbar {
            background: linear-gradient(90deg, #6a00b9, #7a00c9);
            color: white;
            padding: 18px 28px;
            border-radius: 0 0 18px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar-title {
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-badge {
            background-color: #d8b4fe;
            color: #5b21b6;
            border-radius: 20px;
            padding: 10px 18px;
            font-weight: 600;
            display: inline-block;
            text-decoration: none;
        }

        .welcome-title {
            color: #5b00b5;
            font-size: 3rem;
            font-weight: 500;
            margin-top: 40px;
            margin-bottom: 0;
        }

        .welcome-subtitle {
            color: #5b00b5;
            font-size: 1.5rem;
            margin-top: 8px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 32px;
        }

        .stat-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .stat-card {
            background: linear-gradient(135deg, #c300ff, #a100ff);
            border-radius: 28px;
            color: #fff6b0;
            min-height: 170px;
            box-shadow: 0 4px 0 #d11cff, 0 8px 20px rgba(128, 0, 128, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 0 #d11cff, 0 14px 28px rgba(128, 0, 128, 0.24);
        }

        .stat-card .big-number {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 8px;
        }

        .overview-box {
            background-color: rgba(255,255,255,0.22);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .overview-header {
            font-size: 2rem;
            font-weight: 700;
            color: #5b00b5;
            padding: 18px 24px 10px 24px;
        }

        .overview-row {
            border-top: 1px solid rgba(0,0,0,0.08);
            padding: 18px 24px;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .overview-label {
            color: #6a00b9;
            font-weight: 700;
        }

        .overview-value {
            color: #6a00b9;
            font-weight: 700;
            font-size: 1.7rem;
        }

        .main-content {
            padding: 0 36px 40px 36px;
        }
    </style>
</head>
<body>

<div class="topbar">
    <h1 class="topbar-title">Admin Dashboard</h1>
    <div class="topbar-right">
        <a th:href="@{/profile}" class="admin-badge">Your Profile</a>
        <div class="admin-badge" th:text="${adminName}">Admin</div>
        <div class="menu-container">
            <button class="hamburger-btn" type="button" onclick="toggleMenu()">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div class="dropdown-menu-custom" id="dropdownMenu">
                <a th:href="@{/}">Home</a>
             
               <a th:href="@{/admin}">Dashboard</a>
                <a th:href="@{/profile}">My profile</a>
                <a th:href="@{/admin/accounts}">Manage accounts</a>
                <a th:href="@{/admin/offers}">Manage offers</a>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="main-content">

    <div class="welcome-title">Welcome back!</div>
    <div class="welcome-subtitle">Here is what happened while you were away:</div>

    <div class="stat-grid">
        <a th:href="@{/admin/accounts}" class="stat-link">
            <div class="stat-card">
                <div>
                    <span class="big-number" th:text="${userCount}">0</span>
                    Active students
                </div>
            </div>
        </a>
        <a th:href="@{/admin/offers}" class="stat-link">
            <div class="stat-card">
                <div>
                    <span class="big-number" th:text="${offerCount}">0</span>
                    Tutoring offers
                </div>
            </div>
        </a>
    </div>

    <div class="overview-box">
        <div class="overview-header">This Week Overview</div>

        <div class="overview-row">
            <div class="overview-label">Credits Swapped</div>
            <div class="overview-value" th:text="'+' + ${creditsSwapped}">+0</div>
        </div>

        <div class="overview-row">
            <div class="overview-label">New Offers</div>
            <div class="overview-value" th:text="'+' + ${newOffers}">+0</div>
        </div>

        <div class="overview-row">
            <div class="overview-label">New Users</div>
            <div class="overview-value" th:text="'+' + ${newUsers}">+0</div>
        </div>

        <div class="overview-row">
            <div class="overview-label">Top Teacher</div>
            <div class="overview-value" th:text="${topTeacher}">N/A</div>
        </div>
    </div>

</div>

<script>
    function toggleMenu() {
        document.getElementById("dropdownMenu").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest(".menu-container")) {
            const dropdown = document.getElementById("dropdownMenu");
            if (dropdown && dropdown.classList.contains("show")) {
                dropdown.classList.remove("show");
            }
        }
    }
</script>

</body>
</html>
