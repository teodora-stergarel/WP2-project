<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Browse Offers - SkillSwap</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .offers-page {
            padding: 84px 36px 40px;
        }

        .filters-row {
            display: grid;
            grid-template-columns: 2.3fr 0.9fr 0.9fr 0.9fr;
            gap: 12px;
            margin-bottom: 76px;
            align-items: center;
        }

        .search-box,
        .filter-box {
            height: 61px;
            background: #A8A8A8;
            border-radius: 18px;
            border: none;
            color: #F3EFDE;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 25px;
            font-weight: bold;
            padding: 0 20px;
        }

        .search-box::placeholder {
            color: #F3EFDE;
            opacity: 1;
        }

        .new-offer-btn {
            height: 61px;
            background: #563A9C;
            color: #F3EFDE;
            border-radius: 18px;
            text-decoration: none;
            font-size: 25px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .offers-grid-figma {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 36px 38px;
            padding: 0 2px;
        }

        .offer-card-figma {
            height: 186px;
            border: 5px solid #563A9C;
            border-radius: 18px;
            background: #F3EFDE;
            position: relative;
            padding: 8px 14px 14px;
            overflow: hidden;
        }

        .offer-subject {
            background: #C9BEFF;
            color: #563A9C;
            border-radius: 18px;
            height: 30px;
            min-width: 145px;
            max-width: 190px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            padding: 0 18px;
        }

        .offer-description {
            margin: 27px 0 0;
            color: #000;
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.15;
            max-height: 58px;
            overflow: hidden;
        }

        .offer-author {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: #563A9C;
            color: #F3EFDE;
            border-radius: 16px;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: bold;
        }

        .empty-message {
            color: #563A9C;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 80px;
        }
    </style>
</head>

<body>

<nav class="navbar-custom">
    <a th:href="@{/}" class="logo">SkillSwap</a>

    <div class="nav-links">
        <a th:href="@{/profile}" class="nav-link-custom">Your offers</a>

        <div class="menu-container">
            <button class="hamburger-btn" type="button" onclick="toggleMenu()">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <div class="dropdown-menu-custom" id="dropdownMenu">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/offers}">Browse offers</a>
                <a th:href="@{/offers/create}">Add offer</a>
                <a th:href="@{/profile}">My profile</a>
                <a th:href="@{/lesson-requests}">Lesson requests</a>
                <a th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </div>
</nav>

<main class="offers-page">

    <section class="filters-row">
        <input class="search-box" type="text" placeholder="Search offers ...">

        <button class="filter-box" type="button">
            Subject: any
        </button>

        <button class="filter-box" type="button">
            Credits: any
        </button>

        <a th:href="@{/offers/create}" class="new-offer-btn">
            + New offer
        </a>
    </section>

    <div th:if="${param.success == 'deleted'}" class="empty-message">
        Offer deleted successfully.
    </div>

    <div th:if="${param.error == 'notenoughcredits'}" class="empty-message">
        Not enough credits.
    </div>

    <div th:if="${param.error == 'ownoffer'}" class="empty-message">
        You cannot request your own lesson.
    </div>

    <div th:if="${param.error == 'forbidden'}" class="empty-message">
        You are not allowed to delete this offer.
    </div>

    <div th:if="${#lists.isEmpty(offers)}" class="empty-message">
        No offers available yet.
    </div>

    <section class="offers-grid-figma" th:if="${!#lists.isEmpty(offers)}">

        <div class="offer-card-figma" th:each="offer : ${offers}">
            <div class="offer-subject" th:text="${offer.title}">
                Programming
            </div>

            <p class="offer-description" th:text="${offer.description}">
                Offer description
            </p>

            <span class="offer-author" th:text="'@' + ${offer.owner.name}">
                @Maria P.
            </span>
        </div>

    </section>

</main>

<script>
    function toggleMenu() {
        document.getElementById("dropdownMenu").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest(".menu-container")) {
            const dropdown = document.getElementById("dropdownMenu");
            if (dropdown && dropdown.classList.contains("show")) {
                dropdown.classList.remove("show");
            }
        }
    }
</script>

</body>
</html>
