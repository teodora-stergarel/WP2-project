<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Offer - SkillSwap</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .offer-form-page {
            padding: 42px 46px;
        }

        .offer-form-card {
            border: 8px solid #563A9C;
            border-radius: 95px;
            min-height: 650px;
            padding: 48px 52px;
            position: relative;
        }

        .offer-form-header {
            display: flex;
            align-items: center;
            gap: 32px;
            margin-bottom: 40px;
        }

        .plus-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #563A9C;
            color: #F3EFDE;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 72px;
            font-weight: bold;
        }

        .offer-form-title {
            font-size: 54px;
            margin: 0;
            color: #563A9C;
        }

        .close-btn {
            position: absolute;
            top: 36px;
            right: 52px;
            width: 66px;
            height: 66px;
            border: 4px solid #563A9C;
            border-radius: 14px;
            color: #563A9C;
            background: #F3EFDE;
            font-size: 48px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 5px rgba(0,0,0,0.25);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 320px 180px 1fr;
            gap: 72px;
            align-items: start;
        }

        .field-label {
            display: block;
            font-size: 26px;
            font-weight: bold;
            color: #563A9C;
            margin-bottom: 8px;
        }

        .figma-select,
        .description-area {
            background: #D9D9D9;
            border: none;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            padding: 14px 18px;
            width: 100%;
        }

        .figma-select {
            height: 55px;
            cursor: pointer;
        }

        .description-area {
            height: 292px;
            resize: none;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 56px;
            margin-top: 36px;
        }

        .action-btn {
            height: 52px;
            border: none;
            border-radius: 17px;
            background: #563A9C;
            color: #F3EFDE;
            font-size: 24px;
            font-weight: bold;
            font-family: Georgia, "Times New Roman", serif;
            padding: 0 34px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 5px rgba(0,0,0,0.25);
        }
    </style>
</head>

<body>

<nav class="navbar-custom">
    <a th:href="@{/}" class="logo">SkillSwap</a>

    <div class="nav-links">
        <div class="menu-container">
            <button class="hamburger-btn" type="button" onclick="toggleMenu()">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <div class="dropdown-menu-custom" id="dropdownMenu">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/offers}">Browse offers</a>
                <a th:href="@{/offers/create}">Add offer</a>
                <a th:href="@{/profile}">My profile</a>
                <a th:href="@{/lesson-requests}">Lesson requests</a>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                  <button type="submit"
                      style="
                        background:none;
                        border:none;
                        padding:12px 16px;
                        width:100%;
                        text-align:left;
                        cursor:pointer;
                        font-size:16px;
                        font-family:inherit;
                      ">
                    Logout
                  </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="offer-form-page">

    <section class="offer-form-card">

        <a th:href="@{/profile}" class="close-btn">×</a>

        <div class="offer-form-header">
            <div class="plus-circle">+</div>
            <h1 class="offer-form-title">Edit Offer</h1>
        </div>

        <form th:action="@{/offers/edit/{id}(id=${offer.id})}" method="post">

            <div class="form-grid">

                <div>
                    <label class="field-label">Choose Subject</label>

                    <select class="figma-select" name="title" required>
                        <option value="Math" th:selected="${offer.title == 'Math'}">Math</option>
                        <option value="Music" th:selected="${offer.title == 'Music'}">Music</option>
                        <option value="Programming" th:selected="${offer.title == 'Programming'}">Programming</option>
                        <option value="Photoshop" th:selected="${offer.title == 'Photoshop'}">Photoshop</option>
                        <option value="WP" th:selected="${offer.title == 'WP'}">WP</option>
                        <option value="Other" th:selected="${offer.title == 'Other'}">Other</option>
                    </select>
                </div>

                <div>
                    <label class="field-label">No of Credits</label>

                    <select class="figma-select" name="priceCredits" required>
                        <option value="1" th:selected="${offer.priceCredits == 1}">1 credit</option>
                        <option value="2" th:selected="${offer.priceCredits == 2}">2 credits</option>
                        <option value="3" th:selected="${offer.priceCredits == 3}">3 credits</option>
                        <option value="4" th:selected="${offer.priceCredits == 4}">4 credits</option>
                        <option value="5" th:selected="${offer.priceCredits == 5}">5 credits</option>
                    </select>
                </div>

                <div>
                    <label class="field-label">Description</label>

                    <textarea class="description-area"
                              name="description"
                              required
                              th:text="${offer.description}"></textarea>
                </div>

            </div>

            <div class="actions">

        <a th:href="@{/profile}" class="action-btn">
            Cancel
        </a>

        <button type="submit" class="action-btn">
            Save Changes
        </button>

    </div>

    </form>

    <form th:action="@{/offers/delete/{id}(id=${offer.id})}"
        method="post"
        onsubmit="return confirm('Are you sure you want to delete this offer?');">

        <div class="actions" style="margin-top: 18px;">
            <button type="submit"
                    class="action-btn"
                    style="background:#A8A8A8;">
                Delete Offer
            </button>
        </div>

    </form>

        </form>

    </section>

</main>

<script>
    function toggleMenu() {
        document.getElementById("dropdownMenu").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest(".menu-container")) {
            const dropdown = document.getElementById("dropdownMenu");
            if (dropdown && dropdown.classList.contains("show")) {
                dropdown.classList.remove("show");
            }
        }
    }
</script>

</body>
</html>
