<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Offer Details - Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .topbar {
            background: linear-gradient(90deg, #6a00b9, #7a00c9);
            color: white;
            padding: 18px 28px;
            border-radius: 0 0 18px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar-title {
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-badge {
            background-color: #d8b4fe;
            color: #5b21b6;
            border-radius: 20px;
            padding: 10px 18px;
            font-weight: 600;
            display: inline-block;
            text-decoration: none;
        }

        .page-content {
            padding: 50px 40px;
            display: flex;
            justify-content: center;
        }

        .offer-card {
            width: 100%;
            max-width: 900px;
            border: 6px solid #563A9C;
            border-radius: 40px;
            background: #F3EFDE;
            position: relative;
            padding: 50px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 24px;
            width: 44px;
            height: 44px;
            border: 3px solid #563A9C;
            border-radius: 12px;
            background: #F3EFDE;
            color: #563A9C;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .offer-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .subject-pill {
            background-color: #C9BEFF;
            color: #563A9C;
            border-radius: 18px;
            padding: 8px 28px;
            font-size: 1.4rem;
            font-weight: 700;
            display: inline-block;
        }

        .author-link {
            background-color: #563A9C;
            color: white;
            border-radius: 18px;
            padding: 8px 24px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
        }

        .author-link:hover {
            background-color: #432d7a;
        }

        .offer-body {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 32px;
            margin-bottom: 32px;
        }

        .description-box {
            background-color: rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 24px;
            font-size: 1rem;
            color: #333;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            min-height: 180px;
        }

        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-item {
            background-color: #563A9C;
            color: white;
            border-radius: 16px;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
        }

        .info-item span {
            display: block;
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .offer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            flex-wrap: wrap;
        }

        .action-btn {
            height: 50px;
            min-width: 150px;
            border: none;
            border-radius: 16px;
            font-family: Georgia, serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }

        .btn-back { background: #A8A8A8; color: white; }
        .btn-penalty { background: #ffcc00; color: #5b00b5; }
        .btn-delete { background: #ff4444; color: white; }
    </style>
</head>
<body>

<div class="topbar">
    <h1 class="topbar-title">Offer Details</h1>
    <div class="topbar-right">
        <a th:href="@{/admin/offers}" class="admin-badge">← All Offers</a>
        <div class="menu-container">
            <button class="hamburger-btn" type="button" onclick="toggleMenu()">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div class="dropdown-menu-custom" id="dropdownMenu">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/profile}">My profile</a>
                <a th:href="@{/admin}">Admin Dashboard</a>
                <a th:href="@{/admin/accounts}">Manage accounts</a>
                <a th:href="@{/admin/offers}">Manage offers</a>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="page-content">
    <div class="offer-card">

        <a th:href="@{/admin/offers}" class="close-btn">×</a>

        <!-- HEADER: Subject + Author -->
        <div class="offer-header">
            <div class="subject-pill" th:text="${offer.title}">Subject</div>
            <a th:href="@{/admin/accounts/{id}(id=${offer.owner.id})}"
               class="author-link"
               th:text="'@' + ${offer.owner.name}">@User</a>
        </div>

        <!-- BODY: Descriere + Info panel -->
        <div class="offer-body">
            <div class="description-box" th:text="${offer.description}">
                Description goes here...
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <span>Credits</span>
                    <span th:text="${offer.priceCredits} + ' credits'">3 credits</span>
                </div>
                <div class="info-item">
                    <span>Owner email</span>
                    <span th:text="${offer.owner.email}">email</span>
                </div>
                <div class="info-item">
                    <span>Posted on</span>
                    <span th:text="${#temporals.format(offer.createdAt, 'dd MMM yyyy')}">date</span>
                </div>
                <div class="info-item">
                    <span>Penalties</span>
                    <span th:text="${offer.owner.penalties} + '/3'">0/3</span>
                </div>
            </div>
        </div>

        <!-- ACTIUNI -->
        <div class="offer-actions">
            <a th:href="@{/admin/offers}" class="action-btn btn-back">Go back</a>

            <form th:action="@{/admin/accounts/penalty/{id}(id=${offer.owner.id})}"
                  method="post"
                  onsubmit="return confirm('Add penalty to this user?');">
                <button type="submit" class="action-btn btn-penalty">+ Penalty</button>
            </form>

            <form th:action="@{/admin/offers/delete/{id}(id=${offer.id})}"
                  method="post"
                  onsubmit="return confirm('Delete this offer permanently?');">
                <button type="submit" class="action-btn btn-delete">Delete Offer</button>
            </form>
        </div>

    </div>
</div>

<script>
    function toggleMenu() {
        document.getElementById("dropdownMenu").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest(".menu-container")) {
            const dropdown = document.getElementById("dropdownMenu");
            if (dropdown && dropdown.classList.contains("show")) {
                dropdown.classList.remove("show");
            }
        }
    }
</script>

</body>
</html>
