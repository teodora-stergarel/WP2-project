<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Profile</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .topbar {
            background: linear-gradient(90deg, #6a00b9, #7a00c9);
            color: white;
            padding: 18px 28px;
            border-radius: 0 0 18px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar-title {
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-badge {
            background-color: #d8b4fe;
            color: #5b21b6;
            border-radius: 20px;
            padding: 10px 18px;
            font-weight: 600;
            display: inline-block;
            text-decoration: none;
        }

        .cover-area {
            position: relative;
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #7c3aed, #c026d3);
        }

        .cover-area img.cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic-wrapper {
            position: absolute;
            bottom: -55px;
            left: 40px;
            z-index: 10;
        }

        .profile-pic-wrapper img,
        .profile-pic-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #F3EFDE;
            object-fit: cover;
            background-color: #563A9C;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            font-family: Georgia, serif;
        }

        .profile-body {
            padding: 80px 40px 40px 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .user-name {
            font-size: 2rem;
            font-weight: 700;
            color: #563A9C;
            margin-bottom: 4px;
        }

        .user-email {
            font-size: 1.1rem;
            color: #563A9C;
            margin-bottom: 8px;
        }

        .user-bio {
            font-size: 1rem;
            color: #563A9C;
            font-style: italic;
            margin-bottom: 24px;
        }

        .admin-role-badge {
            background-color: #d8b4fe;
            color: #5b21b6;
            border-radius: 12px;
            padding: 6px 18px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 24px;
        }

        .info-box {
            border: 4px solid #563A9C;
            border-radius: 20px;
            padding: 24px;
            background-color: #F3EFDE;
        }

        .info-box-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #563A9C;
            margin-bottom: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid rgba(86,58,156,0.15);
            font-size: 1rem;
            color: #563A9C;
        }

        .info-row:first-child {
            border-top: none;
        }

        .info-value {
            font-weight: 700;
        }

        .edit-profile-btn {
            display: inline-block;
            background-color: #563A9C;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            font-family: Georgia, serif;
            margin-top: 24px;
        }

        .edit-profile-btn:hover {
            background-color: #432d7a;
        }

        .upload-form {
            margin-top: 16px;
        }

        .upload-label {
            display: inline-block;
            background-color: #C9BEFF;
            color: #563A9C;
            border-radius: 12px;
            padding: 8px 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="topbar">
    <h1 class="topbar-title">My Profile</h1>
    <div class="topbar-right">
        <a th:href="@{/admin}" class="admin-badge">← Dashboard</a>
        <div class="menu-container">
            <button class="hamburger-btn" type="button" onclick="toggleMenu()">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div class="dropdown-menu-custom" id="dropdownMenu">
                <a th:href="@{/}">Home</a>

                <a th:href="@{/profile}">My profile</a>
                <a th:href="@{/admin}">Admin Dashboard</a>
                <a th:href="@{/admin/accounts}">Manage accounts</a>
                <a th:href="@{/admin/offers}">Manage offers</a>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- COVER + POZA -->
<div style="position: relative;">
    <div class="cover-area">
        <img th:if="${user.coverImagePath != null}"
             th:src="${user.coverImagePath}"
             class="cover-img" alt="Cover">
    </div>
    <div class="profile-pic-wrapper">
        <img th:if="${user.profileImagePath != null}"
             th:src="${user.profileImagePath}" alt="Profile">
        <div th:unless="${user.profileImagePath != null}"
             class="profile-pic-placeholder">A</div>
    </div>
</div>

<!-- BODY -->
<div class="profile-body">

    <!-- STANGA -->
    <div>
        <div class="user-name" th:text="${user.name}">Name</div>
        <div class="user-email" th:text="${user.email}">Email</div>
        <div th:if="${user.bio != null and !#strings.isEmpty(user.bio)}"
             class="user-bio" th:text="${user.bio}">Bio</div>
        <div class="admin-role-badge">ADMIN</div>

        <a th:href="@{/profile/edit}" class="edit-profile-btn">Edit Profile</a>
    </div>

    <!-- DREAPTA — INFO BOX -->
    <div>
        <div class="info-box">
            <div class="info-box-title">Account Overview</div>

            <div class="info-row">
                <span>Role</span>
                <span class="info-value">Administrator</span>
            </div>

            <div class="info-row">
                <span>Email</span>
                <span class="info-value" th:text="${user.email}">email</span>
            </div>

            <div class="info-row">
                <span>Credits</span>
                <span class="info-value" th:text="${user.creditsBalance}">0</span>
            </div>

            <div class="info-row">
                <span>Total Users</span>
                <span class="info-value" th:text="${userCount}">0</span>
            </div>

            <div class="info-row">
                <span>Total Offers</span>
                <span class="info-value" th:text="${offerCount}">0</span>
            </div>
        </div>

        <!-- Upload poză profil -->
        <form th:action="@{/profile/upload-image}" method="post"
              enctype="multipart/form-data" class="upload-form">
            <label for="imageInput" class="upload-label">Change profile picture</label>
            <input id="imageInput" type="file" name="image"
                   accept="image/*" style="display:none;"
                   onchange="this.form.submit()">
        </form>

        <!-- Upload cover -->
        <form th:action="@{/profile/upload-cover}" method="post"
              enctype="multipart/form-data" class="upload-form">
            <label for="coverInput" class="upload-label">Change cover photo</label>
            <input id="coverInput" type="file" name="cover"
                   accept="image/*" style="display:none;"
                   onchange="this.form.submit()">
        </form>
    </div>

</div>

<script>
    function toggleMenu() {
        document.getElementById("dropdownMenu").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest(".menu-container")) {
            const dropdown = document.getElementById("dropdownMenu");
            if (dropdown && dropdown.classList.contains("show")) {
                dropdown.classList.remove("show");
            }
        }
    }

    document.getElementById("imageInput").addEventListener("change", function() {
        if (this.files && this.files[0]) this.form.submit();
    });

    document.getElementById("coverInput").addEventListener("change", function() {
        if (this.files && this.files[0]) this.form.submit();
    });
</script>

</body>
</html>
