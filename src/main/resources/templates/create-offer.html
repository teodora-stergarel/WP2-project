<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Offer - SkillSwap</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .offer-form-page {
            padding: 42px 46px;
        }

        .offer-form-card {
            border: 8px solid #563A9C;
            border-radius: 95px;
            min-height: 650px;
            padding: 48px 52px;
            position: relative;
        }

        .offer-form-header {
            display: flex;
            align-items: center;
            gap: 32px;
            margin-bottom: 40px;
        }

        .plus-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #563A9C;
            color: #F3EFDE;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 72px;
            font-weight: bold;
        }

        .offer-form-title {
            font-size: 54px;
            margin: 0;
            color: #563A9C;
        }

        .close-btn {
            position: absolute;
            top: 36px;
            right: 52px;
            width: 66px;
            height: 66px;
            border: 4px solid #563A9C;
            border-radius: 14px;
            color: #563A9C;
            background: #F3EFDE;
            font-size: 48px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 5px rgba(0,0,0,0.25);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 320px 180px 1fr;
            gap: 72px;
            align-items: start;
        }

        .field-label {
            display: block;
            font-size: 26px;
            font-weight: bold;
            color: #563A9C;
            margin-bottom: 8px;
        }

        .figma-select,
        .figma-input,
        .description-area {
            background: #D9D9D9;
            border: none;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            padding: 14px 18px;
            width: 100%;
        }

        .figma-select {
            height: 55px;
            cursor: pointer;
        }

        .description-area {
            height: 292px;
            resize: none;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 56px;
            margin-top: 36px;
        }

        .action-btn {
            height: 52px;
            border: none;
            border-radius: 17px;
            background: #563A9C;
            color: #F3EFDE;
            font-size: 24px;
            font-weight: bold;
            font-family: Georgia, "Times New Roman", serif;
            padding: 0 34px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 5px rgba(0,0,0,0.25);
        }

        .figma-input {
            background: #D9D9D9;
            border: none;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            padding: 14px 18px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

<nav class="navbar-custom">
    <a th:href="@{/}" class="logo">SkillSwap</a>

    <div class="nav-links">
        <div class="menu-container">
            <button class="hamburger-btn" type="button" onclick="toggleMenu()">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <div class="dropdown-menu-custom" id="dropdownMenu">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/offers}">Browse offers</a>
                <a th:href="@{/offers/create}">Add offer</a>
                <a th:href="@{/profile}">My profile</a>
                <a th:href="@{/lesson-requests}">Lesson requests</a>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                   <button type="submit" class="logout-btn">
                      Logout
                    </button>
                 </form>
            </div>
        </div>
    </div>
</nav>

<main class="offer-form-page">

    <section class="offer-form-card">

        <a th:href="@{/offers}" class="close-btn">×</a>

        <div class="offer-form-header">
            <div class="plus-circle">+</div>
            <h1 class="offer-form-title">Add New Offer</h1>
        </div>

        <form th:action="@{/offers/create}" method="post" enctype="multipart/form-data">

            <div class="form-grid">

                <div>
                    <label class="field-label">Choose Subject</label>

                    <select class="figma-select" name="title" required>
                        <option value="" disabled selected>Select subject</option>
                        <option value="Math">Math</option>
                        <option value="Music">Music</option>
                        <option value="Programming">Programming</option>
                        <option value="Photoshop">Photoshop</option>
                        <option value="WP">WP</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div>
                    <label class="field-label">No of Credits</label>

                    <select class="figma-select" name="priceCredits" required>
                        <option value="" disabled selected>Select</option>
                        <option value="1">1 credit</option>
                        <option value="2">2 credits</option>
                        <option value="3">3 credits</option>
                        <option value="4">4 credits</option>
                        <option value="5">5 credits</option>
                    </select>
                </div>

                <div>
                    <label class="field-label">Description</label>

                    <textarea class="description-area"
                              name="description"
                              required></textarea>
                </div>

                <div style="grid-column: 1 / span 2; margin-top: 10px;">
                    <label class="field-label">Optional attachment</label>

                    <input type="file"
                        name="attachment"
                        class="figma-input">
                </div>

            </div>

            <div class="actions">
                <a th:href="@{/offers}" class="action-btn">Cancel</a>
                <button type="submit" class="action-btn">Add</button>
            </div>

        </form>

    </section>

</main>

<script>
    function toggleMenu() {
        document.getElementById("dropdownMenu").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest(".menu-container")) {
            const dropdown = document.getElementById("dropdownMenu");
            if (dropdown && dropdown.classList.contains("show")) {
                dropdown.classList.remove("show");
            }
        }
    }
</script>

</body>
</html>
